
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suthaliya Satellite Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{margin:0;font-family:Arial,sans-serif}
h2{padding:12px;margin:0;background:#14532d;color:white;font-size:20px}
#map{height:calc(100vh - 48px);width:100%}
</style>
</head>
<body>
<h2>🛰️ सुठालिया सैटेलाइट नक्शा</h2>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map("map").setView([23.99552,77.13953],14);

const satellite = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {
    maxZoom:19,
    attribution:"Tiles © Esri"
  }
).addTo(map);

const labels = L.tileLayer(
  "https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png",
  {
    maxZoom:19,
    attribution:"Labels © CARTO, OpenStreetMap contributors",
    subdomains:"abcd"
  }
).addTo(map);

L.control.layers(
  {"Satellite":satellite},
  {"Roads and place names":labels}
).addTo(map);

L.marker([23.99552,77.13953])
 .addTo(map)
 .bindPopup("सुठालिया, जिला राजगढ़, मध्य प्रदेश")
 .openPopup();

map.on("click", function(e){
  L.popup()
   .setLatLng(e.latlng)
   .setContent("Latitude: "+e.latlng.lat.toFixed(6)+
   "<br>Longitude: "+e.latlng.lng.toFixed(6))
   .openOn(map);
});
</script>
</body>
</html>
