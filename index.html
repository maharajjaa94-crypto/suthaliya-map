<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suthaliya Live Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>body{margin:0;font-family:Arial,sans-serif}h2{padding:10px;margin:0;background:#14532d;color:white}#map{height:88vh;width:100%}</style>
</head>
<body>
<h2>सुठालिया लाइव नक्शा</h2>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map("map").setView([23.99552,77.13953],14);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);
map.on("click",e=>L.popup().setLatLng(e.latlng).setContent("Latitude: "+e.latlng.lat.toFixed(6)+"<br>Longitude: "+e.latlng.lng.toFixed(6)).openOn(map));
L.marker([23.99552,77.13953]).addTo(map).bindPopup("सुठालिया, जिला राजगढ़, मध्य प्रदेश").openPopup();
</script>
</body>
</html>
